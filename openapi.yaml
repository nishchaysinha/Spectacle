openapi: 3.0.9
info:
  title: Flask API
  version: 1.0.0
  description: A simple Flask application API.
paths:
  /ping:
    get:
      summary: Keep the server active
      operationId: ping
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /videos:
    get:
      summary: Retrieve a list of videos
      operationId: getVideos
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Number of videos per page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A list of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
components:
  schemas:
    PingResponse:
      type: object
      properties:
        message:
          type: string
          description: A simple message.
          example: "pong!"
        number:
          type: integer
          description: A random integer.
          example: 42
      required:
        - message
        - number
    Video:
      type: object
      properties:
        _id:
          type: string
          description: Unique identifier for the video (MongoDB ObjectId).
          example: "60c72b2f9b1e8b001c8e4a7b"
        title:
          type: string
          description: Title of the video.
          example: "My Awesome Video"
        description:
          type: string
          description: Description of the video.
          example: "This is a description of my awesome video."
        publishedAt:
          type: string
          format: date-time
          description: Date and time when the video was published.
          example: "2023-10-27T10:00:00Z"
        url:
          type: string
          format: uri
          description: URL to the video.
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      required:
        - _id
        - title
        - publishedAt
        - url